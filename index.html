 <!DOCTYPE html>
<html>
<head>
<title>TalkToSmile</title>
<style>
body{
  background:#020617;
  color:white;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}

.box{
  background:#0f172a;
  padding:30px;
  width:300px;
  text-align:center;
  border-radius:12px;
  box-shadow:0 0 20px #38bdf8;
}

button{
  padding:12px 20px;
  background:#38bdf8;
  border:none;
  border-radius:6px;
  font-size:16px;
}
button:hover{
  background:#0ea5e9;
}

#status{
  margin-top:10px;
  color:#a5f3fc;
}
#chatBox{
  margin-top:15px;
  background:#020617;
  padding:10px;
  border-radius:6px;
  height:120px;
  overflow-y:auto;
  text-align:left;
  font-size:14px;
}
#msgInput{
  width:90%;
  padding:8px;
  margin-top:10px;
  border-radius:5px;
  border:none;
}
</style>
</head>
<body>

<div class="box">

<h1>TalkToSmile</h1>

<p>Random Voice Chat With Strangers</p>

<button onclick="startChat()">Start Chat</button>
<button onclick="disconnectChat()">Disconnect</button>

<p id="status">Status: Idle</p>
 <div id="chatBox"></div>

<input type="text" id="msgInput" placeholder="Type your message..." />
<button onclick="sendMsg()">Send</button>
<script>
function startChat(){
 document.getElementById("status").innerText="Status: Connected!";
}

function disconnectChat(){
 document.getElementById("status").innerText="Status: Disconnected";
 document.getElementById("chatBox").innerHTML="";
}

function sendMsg(){
 let msg=document.getElementById("msgInput").value;
 if(msg==="") return;

 let chat=document.getElementById("chatBox");
 chat.innerHTML+="<p><b>You:</b> "+msg+"</p>";
 chat.scrollTop = chat.scrollHeight;
 document.getElementById("msgInput").value="";

 setTimeout(function(){
  chat.innerHTML+="<p><b>Stranger:</b> Hello 👋</p>";
  chat.scrollTop = chat.scrollHeight;
 },1000);
}
</script>
</div>
</body>
 
</html>
