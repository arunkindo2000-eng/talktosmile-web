<!DOCTYPE html>
<html>
<head>
<title>TalkToSmile</title>
  <style>
body{
  background:#020617;
  color:white;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}

.box{
  background:#0f172a;
  padding:30px;
  width:300px;
  text-align:center;
  border-radius:12px;
  box-shadow:0 0 20px #38bdf8;
}

button{
  padding:12px 20px;
  background:#38bdf8;
  border:none;
  border-radius:6px;
  font-size:16px;
}

#status{
  margin-top:10px;
  color:#a5f3fc;
}
  </style>
</head>
<body>

<div class="box">

<h1>TalkToSmile</h1>
<p>Random Voice Chat With Strangers</p>

<button onclick="startChat()">Start Chat</button>

<p id="status">Status: Idle</p>

</div>

<button onclick="startChat()">Start Chat</button>
  <p id="status">Status: Idle</p>

<script>
function startChat(){

  document.getElementById("status").innerText =
   "Status: Requesting microphone...";

  navigator.mediaDevices.getUserMedia({ audio: true })
    .then(function(stream){

      document.getElementById("status").innerText =
       "Status: Searching for user...";

      setTimeout(function(){
        document.getElementById("status").innerText =
         "Status: Connected!";
      }, 3000);

    })
    .catch(function(error){
      document.getElementById("status").innerText =
       "Status: Microphone denied!";
    });

}
</script>

</body>
</html>
