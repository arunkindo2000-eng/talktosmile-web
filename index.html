<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="google-site-verification"
        content="_Je0Jq54EPcu-XQxRZ35QeGWJu_-MFEvxsZLD74">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Talk To Smile – Free Random Chat with Strangers Online</title>

  <meta name="description"
        content="Talk To Smile is a free random chat site to meet and chat with strangers online through text and voice chat without registration.">

  <meta name="keywords"
        content="Talk To Smile, talk to strangers online, random chat, free random chat, chat with strangers, random voice chat">

  <meta name="robots" content="index, follow">

  <link rel="canonical"
        href="https://arunkindo2000-eng.github.io/talktosmile-web/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Talk To Smile">
  <meta property="og:title"
        content="Talk To Smile – Free Random Chat">
  <meta property="og:description"
        content="Talk to strangers online through free text and voice chat.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background: #020617;
      color: white;
      text-align: center;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    img.logo {
      width: 100px;
      height: auto;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 25px;
      margin: 10px 0;
    }

    h2 {
      font-size: 20px;
      margin-top: 25px;
    }

    h3 {
      margin-top: 20px;
    }

    p {
      color: #cbd5e1;
      line-height: 1.6;
    }

    #usernameInput,
    #msgInput {
      display: block;
      width: 90%;
      max-width: 535px;
      margin: 15px auto 10px;
      padding: 15px;
      border-radius: 14px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    button {
      margin: 6px;
      padding: 13px 20px;
      border-radius: 12px;
      border: none;
      background: #0ea5e9;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    #onlineUsers {
      margin: 15px auto;
      padding: 12px 22px;
      width: fit-content;
      border-radius: 25px;
      background: #101828;
      color: #4ade80;
      font-weight: bold;
      font-size: 17px;
    }

    #status {
      margin: 15px;
      color: #94a3b8;
      font-size: 18px;
    }

    #chatBox {
      height: 430px;
      border: 1px solid #0ea5e9;
      margin: 20px auto;
      width: 92%;
      max-width: 600px;
      overflow-y: auto;
      padding: 15px;
      border-radius: 14px;
      text-align: left;
      background: #020617;
    }

    #chatBox div {
      margin-bottom: 10px;
      padding: 8px;
      border-radius: 8px;
      word-wrap: break-word;
    }

    #remoteAudio {
      display: none;
    }

    footer {
      margin-top: 30px;
      padding-bottom: 20px;
    }

    footer a {
      color: #38bdf8;
    }

    @media (max-width: 600px) {
      body {
        padding: 15px;
      }

      h1 {
        font-size: 22px;
      }

      button {
        font-size: 15px;
        padding: 12px 15px;
      }

      #chatBox {
        height: 400px;
      }
    }
  </style>
</head>

<body>

  <img class="logo"
       src="logo.png"
       alt="Talk To Smile Logo">

  <h1>Talk To Smile – Free Random Chat with Strangers</h1>

  <p>
    Talk to strangers online through free random text and voice chat.
    No registration required.
  </p>

  <input
    id="usernameInput"
    type="text"
    maxlength="20"
    placeholder="Enter your username..."
  >

  <div id="onlineUsers">
    🟢 <span id="onlineCount">0</span> Users Online
  </div>

  <p id="status">Status: Idle</p>

  <div>
    <button id="startBtn">Start Chat</button>
    <button id="disconnectBtn">⏭️ Next Stranger</button>
  </div>

  <div>
    <button id="voiceBtn">🎙️ Start Voice</button>
    <button id="muteBtn">🔇 Mute</button>
    <button id="endVoiceBtn">📞 End Voice</button>
  </div>

  <audio id="remoteAudio" autoplay playsinline></audio>

  <div id="chatBox"></div>

  <input
    id="msgInput"
    type="text"
    placeholder="Type message..."
    autocomplete="off"
  >

  <button id="sendBtn">Send</button>

  <footer>
    <p>
      <a href="privacy.html">Privacy Policy</a>
      |
      <a href="terms.html">Terms & Conditions</a>
    </p>
  </footer>

  <!-- ONLY script.js here -->
  <script type="module" src="script.js?v=5"></script>

</body>
</html>
