<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TalkToSmile</title>

  <style>
    body{
      background:#020617;
      color:white;
      text-align:center;
      font-family:sans-serif;
      margin:0;
      padding:20px;
    }

    h1{
      color:#38bdf8;
    }

    button{
      margin:5px;
      padding:10px 15px;
      border-radius:10px;
      border:none;
      background:#0ea5e9;
      color:white;
      font-size:14px;
    }

    #chatBox{
      height:250px;
      border:1px solid #0ea5e9;
      margin:15px auto;
      width:90%;
      max-width:400px;
      overflow-y:auto;
      padding:10px;
      border-radius:10px;
      text-align:left;
    }

    input{
      padding:10px;
      width:80%;
      border-radius:10px;
      border:none;
      outline:none;
      margin-top:10px;
    }

    #status{
      margin-top:10px;
      color:#94a3b8;
    }
  </style>
</head>

<body>

  <h1>TalkToSmile 😎</h1>
  <p>Random Chat With Strangers</p>

  <!-- STATUS -->
  <p id="status">Status: Idle</p>

  <!-- BUTTONS -->
  <button id="startBtn">Start Chat</button>
  <button id="disconnectBtn">Disconnect</button>

  <!-- CHAT BOX -->
  <div id="chatBox"></div>

  <!-- INPUT -->
  <input id="msgInput" placeholder="Type message...">
  <br>
  <button id="sendBtn">Send</button>

  <!-- IMPORTANT: JS FILE LINK -->
  <script type="module" src="script.js"></script>

</body>
</html>
