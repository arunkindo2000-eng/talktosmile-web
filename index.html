
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Talk To Smile - Free Random Chat with Strangers</title>

  <meta name="description" content="Talk to strangers online through free random text and voice chat. No registration required.">
  <meta name="keywords" content="TalkToSmile, random chat, talk to strangers, free voice chat, free text chat">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#020617">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #020617;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      min-height: 100vh;
      padding: 25px 15px;
    }

    .container {
      width: 100%;
      max-width: 850px;
      margin: auto;
    }

    .logo {
      width: 190px;
      height: 190px;
      object-fit: contain;
      background: white;
      margin: 0 auto 40px;
      display: block;
    }

    h1 {
      color: #22d3ee;
      font-size: 36px;
      line-height: 1.35;
      margin-bottom: 32px;
    }

    .subtitle {
      color: #cbd5e1;
      font-size: 25px;
      line-height: 1.8;
      margin-bottom: 38px;
    }

    #usernameInput {
      width: 95%;
      padding: 25px;
      border: 1px solid #64748b;
      border-radius: 25px;
      font-size: 25px;
      outline: none;
      margin-bottom: 28px;
    }

    .online {
      display: inline-block;
      background: #111827;
      color: #4ade80;
      padding: 22px 40px;
      border-radius: 50px;
      font-size: 27px;
      font-weight: bold;
      margin-bottom: 35px;
    }

    #status {
      color: #94a3b8;
      font-size: 27px;
      margin-bottom: 50px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 22px;
    }

    button {
      border: none;
      background: #0ea5e9;
      color: white;
      padding: 22px 28px;
      border-radius: 23px;
      font-size: 25px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #0284c7;
    }

    button:active {
      transform: scale(0.97);
    }

    #startBtn {
      background: #0284c7;
    }

    #nextBtn {
      background: #0ea5e9;
    }

    #disconnectBtn {
      background: #dc2626;
    }

    .voice-buttons {
      margin-top: 22px;
    }

    #muteBtn {
      background: #0ea5e9;
    }

    #endVoiceBtn {
      background: #0284c7;
    }

    .chat-area {
      width: 95%;
      margin: 50px auto 25px;
      border: 1px solid #06b6d4;
      border-radius: 25px;
      padding: 15px;
    }

    #chatBox {
      width: 100%;
      height: 380px;
      overflow-y: auto;
      text-align: left;
      padding: 10px;
      color: white;
      font-size: 17px;
    }

    .message-input {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    #msgInput {
      flex: 1;
      min-width: 0;
      padding: 17px;
      border-radius: 15px;
      border: none;
      font-size: 17px;
      outline: none;
    }

    #sendBtn {
      padding: 15px 25px;
      font-size: 18px;
      border-radius: 15px;
    }

    footer {
      color: #94a3b8;
      font-size: 14px;
      margin: 35px 0 15px;
    }

    @media(max-width: 600px) {
      body {
        padding: 25px 10px;
      }

      .logo {
        width: 190px;
        height: 190px;
      }

      h1 {
        font-size: 29px;
      }

      .subtitle {
        font-size: 20px;
      }

      #usernameInput {
        font-size: 21px;
        padding: 20px;
      }

      .online {
        font-size: 22px;
        padding: 18px 28px;
      }

      #status {
        font-size: 22px;
      }

      button {
        font-size: 20px;
        padding: 18px 22px;
      }

      .buttons {
        gap: 12px;
      }

      #chatBox {
        height: 320px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- Logo: apni existing logo file ka naam yahan rakho -->
    <img
      class="logo"
      src="logo.png"
      alt="Talk To Smile Logo"
      onerror="this.style.display='none'"
    >

    <h1>Talk To Smile - Free Random Chat with Strangers</h1>

    <p class="subtitle">
      Talk to strangers online through free random text and voice chat.
      No registration required.
    </p>

    <!-- Username -->
    <input
      type="text"
      id="usernameInput"
      placeholder="Enter your username"
      maxlength="20"
      autocomplete="off"
    >

    <!-- Online users -->
    <div class="online">
      🟢 <span id="onlineCount">0</span> Users Online
    </div>

    <!-- Status -->
    <div id="status">Status: Connecting...</div>

    <!-- Chat buttons -->
    <div class="buttons">

      <button id="startBtn" type="button">
        🚀 Start Chat
      </button>

      <button id="nextBtn" type="button">
        ⏭️ Next Stranger
      </button>

      <button id="disconnectBtn" type="button">
        ❌ Disconnect
      </button>

    </div>

    <!-- Voice controls -->
    <div class="buttons voice-buttons">

      <button id="voiceBtn" type="button">
        🎙️ Start Voice
      </button>

      <button id="muteBtn" type="button">
        🔊 Mute
      </button>

      <button id="endVoiceBtn" type="button">
        📞 End Voice
      </button>

    </div>

    <!-- Text chat -->
    <section class="chat-area">

      <div id="chatBox" aria-live="polite"></div>

      <div class="message-input">

        <input
          type="text"
          id="msgInput"
          placeholder="Type your message..."
          maxlength="500"
          autocomplete="off"
        >

        <button id="sendBtn" type="button">
          Send
        </button>

      </div>

    </section>

    <!-- Remote voice audio -->
    <audio id="remoteAudio" autoplay playsinline></audio>

    <footer>
      © 2026 TalkToSmile. Chat • Meet • Be Yourself.
    </footer>

  </main>

  <!-- Socket.IO frontend -->
  <script type="module" src="script.js?v=7"></script>

</body>
</html>
