<!DOCTYPE html>
<html>
<head>
  <title>TalkToSmile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      background:#020617;
      color:white;
      font-family:Arial;
      margin:0;
    }

    .page{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding-bottom:120px;
    }

    .box{
      background:#0f172a;
      padding:20px;
      width:90%;
      max-width:420px;
      text-align:center;
      border-radius:16px;
      box-shadow:0 0 25px #38bdf8;
    }

    button{
      padding:12px 20px;
      background:#38bdf8;
      border:none;
      border-radius:6px;
      font-size:16px;
      margin:5px;
    }

    #status{
      margin-top:10px;
      color:#a5f3fc;
    }

    #chatBox{
      margin-top:15px;
      background:#020617;
      padding:10px;
      border-radius:6px;
      height:220px;
      overflow-y:auto;
      text-align:left;
      font-size:14px;
    }

    #msgInput{
      width:90%;
      padding:8px;
      margin-top:10px;
      border-radius:5px;
      border:none;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="box">

      <h1>TalkToSmile</h1>
      <p>Random Voice Chat With Strangers</p>

      <button onclick="startChat()">Start Chat</button>
      <button onclick="disconnectChat()">Disconnect</button>

      <p id="status">Status: Idle</p>

      <div id="chatBox"></div>

      <input
        type="text"
        id="msgInput"
        placeholder="Type your message..."
        oninput="typing()"
      />

      <br>
      <button onclick="sendMsg()">Send</button>

    </div>
  </div>
<script>
let socket;

function startChat(){
  socket = new WebSocket("wss://talktosmile-server.onrender.com");

  document.getElementById("status").innerText = "Status: Connecting...";

  socket.onopen = () => {
    document.getElementById("status").innerText = "Status: Connected";
    addMsg("System", "Waiting for a stranger...");
  };

  socket.onmessage = (event) => {
    if(event.data === "__typing__"){
      document.getElementById("status").innerText = "Stranger is typing...";
      return;
    }

    document.getElementById("status").innerText = "Status: Connected";
    addMsg("Stranger", event.data);
  };

  socket.onclose = () => {
    document.getElementById("status").innerText = "Status: Disconnected";
    addMsg("System", "Stranger disconnected.");
  };

  socket.onerror = () => {
    document.getElementById("status").innerText = "Status: Server Error";
  };
}

function disconnectChat(){
  if(socket){
    socket.close();
  }
}

function sendMsg(){
  if(!socket || socket.readyState !== 1){
    alert("Server connected nahi hai");
    return;
  }

  let input = document.getElementById("msgInput");
  let msg = input.value.trim();
  if(msg === "") return;

  addMsg("You", msg);
  socket.send(msg);
  input.value = "";
}

function typing(){
  if(!socket || socket.readyState !== WebSocket.OPEN){
    socket.send("__typing__");
  }
}

function addMsg(who, text){
  let box = document.getElementById("chatBox");
  box.innerHTML += `<p><b>${who}:</b> ${text}</p>`;
  box.scrollTop = box.scrollHeight;
}
</script>
  <!-- JS YAHAN AAYEGA -->
</body>
</html>
