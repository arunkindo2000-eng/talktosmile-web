
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Talk To Smile - Free Random Chat with Strangers</title>
  <meta name="description" content="Talk to strangers online through free random text and voice chat. No registration required.">
  <meta name="keywords" content="TalkToSmile, random chat, talk to strangers, free voice chat, online text chat">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#030617">

  <link rel="icon" href="logo.png" type="image/png">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px 15px;
      background: #030617;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 850px;
      margin: auto;
    }

    .logo {
      width: 190px;
      height: auto;
      object-fit: contain;
      margin: 10px auto 35px;
      display: block;
    }

    h1 {
      color: #22d3ee;
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1.25;
      margin: 25px 0;
    }

    .description {
      color: #cbd5e1;
      font-size: clamp(18px, 3vw, 28px);
      line-height: 1.7;
      margin: 35px 0 45px;
    }

    #usernameInput {
      width: 95%;
      max-width: 750px;
      padding: 25px;
      border-radius: 30px;
      border: 1px solid #cbd5e1;
      background: white;
      color: #111827;
      font-size: 25px;
      outline: none;
      margin-bottom: 30px;
    }

    .online {
      display: inline-block;
      padding: 22px 35px;
      border-radius: 50px;
      background: #111827;
      color: #4ade80;
      font-size: 25px;
      font-weight: bold;
      margin: 0 0 35px;
    }

    #status {
      color: #94a3b8;
      font-size: 25px;
      margin: 20px 0 55px;
      min-height: 32px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
      margin-bottom: 25px;
    }

    button {
      border: none;
      border-radius: 28px;
      padding: 22px 28px;
      background: #0ea5e9;
      color: white;
      font-size: 23px;
      cursor: pointer;
      min-height: 78px;
    }

    button:active {
      transform: scale(.97);
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    #startBtn {
      background: #0284c7;
    }

    #disconnectBtn {
      background: #dc2626;
    }

    #voiceBtn, #muteBtn, #endVoiceBtn {
      background: #0ea5e9;
    }

    #chatBox {
      width: 95%;
      max-width: 750px;
      height: 420px;
      margin: 35px auto 20px;
      padding: 15px;
      border: 1px solid #06b6d4;
      border-radius: 25px;
      overflow-y: auto;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .message-area {
      display: flex;
      gap: 10px;
      width: 95%;
      max-width: 750px;
      margin: 0 auto 35px;
    }

    #msgInput {
      flex: 1;
      min-width: 0;
      padding: 17px;
      border-radius: 15px;
      border: none;
      font-size: 17px;
    }

    #sendBtn {
      min-height: auto;
      padding: 15px 22px;
      border-radius: 15px;
      font-size: 18px;
    }

    footer {
      color: #94a3b8;
      padding: 30px 10px;
      font-size: 14px;
    }

    @media(max-width: 500px) {
      body {
        padding: 15px 8px;
      }

      button {
        font-size: 19px;
        padding: 18px 20px;
        min-height: 65px;
      }

      .online {
        font-size: 20px;
      }

      #status {
        font-size: 21px;
      }

      #chatBox {
        height: 350px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <img class="logo" src="logo.png" alt="Talk To Smile Logo">

    <h1>Talk To Smile - Free Random Chat with Strangers</h1>

    <p class="description">
      Talk to strangers online through free random text and voice chat.
      No registration required.
    </p>

    <input
      type="text"
      id="usernameInput"
      placeholder="Enter your username"
      maxlength="20"
      autocomplete="off"
    >

    <div class="online">
      🟢 <span id="onlineCount">0</span> Users Online
    </div>

    <div id="status" role="status" aria-live="polite">
      Status: Idle
    </div>

    <div class="buttons">
      <button id="startBtn">🚀 Start Chat</button>
      <button id="nextBtn">⏭️ Next Stranger</button>
      <button id="disconnectBtn">❌ Disconnect</button>
    </div>

    <div class="buttons">
      <button id="voiceBtn">🎙️ Start Voice</button>
      <button id="muteBtn">🔊 Mute</button>
      <button id="endVoiceBtn">📞 End Voice</button>
    </div>

    <audio id="remoteAudio" autoplay playsinline></audio>

    <div id="chatBox" aria-live="polite"></div>

    <div class="message-area">
      <input
        type="text"
        id="msgInput"
        placeholder="Type your message..."
        maxlength="500"
        autocomplete="off"
      >
      <button id="sendBtn">Send</button>
    </div>

  </main>

  <footer>
    © 2026 TalkToSmile. Chat • Meet • Be Yourself.
  </footer>

  <!-- Socket.IO client library -->
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

  <!-- Main application JavaScript -->
  <script src="script.js?v=7"></script>

</body>
</html>
